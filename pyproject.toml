[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rootai-semantic-parser"
version = "0.20.0"
description = "Polyglot semantic parser with taint analysis and finding-profile policy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "RootAI" }
]
dependencies = [
  "pydantic>=2.8,<3",
  "tqdm>=4.66,<5",
  "tree-sitter>=0.24,<0.26",
  "tree-sitter-language-pack>=0.8,<1",
  "tree-sitter-javascript>=0.23,<0.25",
  "tree-sitter-go>=0.23,<0.25",
  "tree-sitter-typescript>=0.23,<0.25",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "flask>=3.0,<4",
]

[project.scripts]
semantic-parser = "rootai_semantic_parser.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["rootai_semantic_parser*"]

[tool.pytest.ini_options]
testpaths = [
  "tests/unit",
  "tests/integration",
  "tests/benchmarks",
]
pythonpath = ["."]
